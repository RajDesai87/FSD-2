<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var a = {"name":"abc","age":25}
        console.log(a)
        console.log(a.name)
        console.log(a["age"])
        
        document.write(a) // Here object is not display properly
        document.write(JSON.stringify(a)) // Now string is read properly
        document.write(a.name)
        document.write(a["age"])

        document.write(`<br>`)
        
        a = '{"name":"abc","age":25}'
        console.log(a)
        console.log(a.name)
        console.log(a["age"])
        document.write(a)
        document.write(a.name)
        document.write(a["age"])

        document.write(`<br>`)

        var data = JSON.parse(a)
        document.write(data) // Here object is not display properly
        document.write(data.name)
        document.write(data["age"])
        
    </script>
</body>
</html>
